name: Deploy Frontend Development

# GCP/frontend-development → oatmeal-frontend-development in oatmeal-farm-staging.
# DEVELOPMENT_* secrets/vars are optional; fall back to staging WIF, registry, and API URLs
# until a dedicated testing stack exists. Never use animated-flare-421518.
on:
  push:
    branches: ['GCP/frontend-development']
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - '**/*.md'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.DEVELOPMENT_GCP_PROJECT_ID || secrets.STAGING_GCP_PROJECT_ID || 'oatmeal-farm-staging' }}
  REGION: ${{ vars.DEVELOPMENT_REGION || vars.STAGING_REGION || 'us-central1' }}
  IMAGE_URI_PREFIX: ${{ vars.DEVELOPMENT_REGION || vars.STAGING_REGION || 'us-central1' }}-docker.pkg.dev/${{ secrets.DEVELOPMENT_GCP_PROJECT_ID || secrets.STAGING_GCP_PROJECT_ID || 'oatmeal-farm-staging' }}/${{ vars.DEVELOPMENT_ARTIFACT_REGISTRY_REPOSITORY || vars.STAGING_ARTIFACT_REGISTRY_REPOSITORY || 'oatmeal-farm-registry' }}/frontend
  CLOUD_RUN_SERVICE: oatmeal-frontend-development
  RUNTIME_SERVICE_ACCOUNT: ${{ vars.DEVELOPMENT_FRONTEND_RUNTIME_SA || vars.STAGING_FRONTEND_RUNTIME_SA || 'frontend-sa@oatmeal-farm-staging.iam.gserviceaccount.com' }}
  VITE_API_URL: ${{ vars.DEVELOPMENT_BACKEND_URL || vars.STAGING_BACKEND_URL || 'https://oatmeal-backend-staging-1087130530284.us-central1.run.app' }}
  VITE_SAIGE_API_URL: ${{ vars.DEVELOPMENT_SAIGE_URL || vars.STAGING_SAIGE_URL || 'https://oatmeal-saige-staging-lrviw4iujq-uc.a.run.app' }}
  VITE_CROP_API_URL: ${{ vars.DEVELOPMENT_CROP_API_URL || vars.STAGING_CROP_API_URL || 'https://oatmeal-backend-staging-1087130530284.us-central1.run.app/cm' }}
  VITE_NEWS_API_URL: ${{ vars.DEVELOPMENT_NEWS_API_URL || vars.STAGING_NEWS_API_URL || 'https://oatmeal-backend-staging-1087130530284.us-central1.run.app' }}
  VITE_CONTACT_RECIPIENT_EMAIL: ${{ vars.DEVELOPMENT_CONTACT_EMAIL || vars.STAGING_CONTACT_EMAIL || 'change-this-contact@oatmeal-ai.com' }}
  VITE_OTF_API_URL: ${{ vars.DEVELOPMENT_OTF_API_URL || vars.STAGING_OTF_API_URL || '' }}

jobs:
  check-development-wif:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check development or staging WIF
        id: check
        shell: bash
        run: |
          provider="${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER }}${{ secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          sa="${{ secrets.DEVELOPMENT_GCP_SERVICE_ACCOUNT }}${{ secrets.STAGING_GCP_SERVICE_ACCOUNT }}"
          if [ -n "$provider" ] && [ -n "$sa" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DEVELOPMENT_* or STAGING_* WIF secrets. Skipping development deploy."
          fi

  deploy-development:
    needs: check-development-wif
    if: needs.check-development-wif.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard development project
        shell: bash
        run: |
          project="${GCP_PROJECT_ID}"
          if [ "$project" = "animated-flare-421518" ]; then
            echo "::error::DEVELOPMENT_GCP_PROJECT_ID must be oatmeal-farm-staging. Never animated-flare-421518 (Oatmeal AI)."
            exit 1
          fi
          echo "Development deploy project=${project} service=${CLOUD_RUN_SERVICE}"
          echo "Auth uses DEVELOPMENT_GCP_* if set, otherwise STAGING_GCP_* WIF."

      - name: Set short commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud (Development)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DEVELOPMENT_GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.DEVELOPMENT_GCP_SERVICE_ACCOUNT || secrets.STAGING_GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg "VITE_API_URL=${{ env.VITE_API_URL }}" \
            --build-arg "VITE_SAIGE_API_URL=${{ env.VITE_SAIGE_API_URL }}" \
            --build-arg "VITE_CROP_API_URL=${{ env.VITE_CROP_API_URL }}" \
            --build-arg "VITE_NEWS_API_URL=${{ env.VITE_NEWS_API_URL }}" \
            --build-arg "VITE_CONTACT_RECIPIENT_EMAIL=${{ env.VITE_CONTACT_RECIPIENT_EMAIL }}" \
            --build-arg "VITE_OTF_API_URL=${{ env.VITE_OTF_API_URL }}" \
            -t "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}" \
            .

      - name: Push Docker image
        run: |
          docker push "${{ env.IMAGE_URI_PREFIX }}:${{ steps.vars.outputs.sha_short }}"

      - name: Deploy to Cloud Run (testing)
        run: |
          extra=()
          if [ -n "${RUNTIME_SERVICE_ACCOUNT}" ]; then
            extra+=(--service-account "${RUNTIME_SERVICE_ACCOUNT}")
          fi
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --image "${IMAGE_URI_PREFIX}:${{ steps.vars.outputs.sha_short }}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            "${extra[@]}" \
            --quiet

      - name: Print deployed URL
        run: |
          gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${REGION}" \
            --format="value(status.url)"
